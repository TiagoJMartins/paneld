name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing useful left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # mise installs Rust through rustup, but this action's cache only covers
          # the mise data directory. On a cache hit mise believes Rust is present
          # while rustup's toolchain is not fully restored, and `cargo fmt` then
          # fails with "'cargo-fmt' is not installed for the toolchain"
          # (jdx/mise-action#215, still open). Caching the toolchain is not worth
          # that failure mode; rust-cache below covers the part that actually costs
          # minutes.
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: mise run build

  # Builds the image without pushing, so a broken Dockerfile surfaces on the pull
  # request that broke it rather than on release day. Needs no registry
  # credentials, so it works on pull requests from forks.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
